
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dessert Explorer</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:Arial,sans-serif;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:white;
  color:black;
}
.secondary{
  background:#172554;
  color:white;
}
.card{
  margin-top:20px;
  background:#0f172a;
  border-radius:28px;
  overflow:hidden;
}
.hero{
  width:100%;
  height:340px;
  object-fit:cover;
  background:#111827;
}
.content{
  padding:24px;
}
.recipe{
  display:inline-block;
  margin-top:14px;
  background:linear-gradient(90deg,#f97316,#ec4899);
  color:white;
  padding:14px 22px;
  border-radius:16px;
  text-decoration:none;
}
.search{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:none;
  border-radius:18px;
  box-sizing:border-box;
}
.item{
  margin-top:10px;
  background:#111827;
  border-radius:16px;
  padding:14px;
  cursor:pointer;
}
.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}
.modal-box{
  width:90%;
  max-width:500px;
  max-height:80vh;
  overflow:auto;
  background:#111827;
  border-radius:20px;
  padding:20px;
}
.saved{
  background:#172554;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>🍰 Dessert Explorer</h1>

<div class="buttons">
  <button class="primary" id="randomBtn">🎲 Random Dessert</button>
  <button class="secondary" id="saveBtn">✅ Made</button>
  <button class="secondary" id="viewBtn">📘 What We've Made</button>
  <button class="secondary" id="clearBtn">🗑 Clear List</button>
</div>

<div class="card">
  <img id="hero" class="hero" alt="Dessert image">
  <div class="content">
    <h2 id="dessert"></h2>
    <h3 id="country"></h3>
    <a id="recipe" class="recipe" target="_blank">View Recipe</a>
  </div>
</div>

<input id="search" class="search" placeholder="Search desserts or countries">

<div id="list"></div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>What We've Made</h2>
    <div id="savedList"></div>
    <button class="secondary" id="closeModal" style="margin-top:16px;width:100%">Close</button>
  </div>
</div>

<script>
let desserts = [];
let current = null;
let made = JSON.parse(localStorage.getItem('madeDesserts') || '[]');

fetch('./desserts.json')
.then(r => r.json())
.then(data => {
  desserts = data;
  current = desserts[0];
  render();
  renderList(desserts);
})
.catch(err => {
  console.error(err);
  alert('Could not load desserts.json');
});

function render(){
  const img = document.getElementById('hero');

  img.onerror = () => {
    img.src = 'https://picsum.photos/1200/800';
  };

  img.src = current.image;

  document.getElementById('dessert').textContent = current.dessert;
  document.getElementById('country').textContent = current.country;
  document.getElementById('recipe').href = current.recipe;
}

function renderList(items){
  const list = document.getElementById('list');

  list.innerHTML = '';

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<b>' + item.dessert + '</b><br>' + item.country;

    div.addEventListener('click', () => {
      current = item;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    list.appendChild(div);
  });
}

document.getElementById('randomBtn').addEventListener('click', () => {
  current = desserts[Math.floor(Math.random() * desserts.length)];
  render();
});

document.getElementById('saveBtn').addEventListener('click', () => {

  const exists = made.find(x =>
    x.country === current.country &&
    x.dessert === current.dessert
  );

  if(!exists){
    made.push(current);
    localStorage.setItem('madeDesserts', JSON.stringify(made));
    alert('Dessert saved');
  }
});

document.getElementById('viewBtn').addEventListener('click', () => {
  renderSaved();
  document.getElementById('modal').style.display = 'flex';
});

document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  made = [];
  localStorage.removeItem('madeDesserts');
  renderSaved();
});

document.getElementById('search').addEventListener('input', e => {

  const q = e.target.value.toLowerCase();

  const filtered = desserts.filter(d =>
    d.country.toLowerCase().includes(q) ||
    d.dessert.toLowerCase().includes(q)
  );

  renderList(filtered);
});

function renderSaved(){

  const el = document.getElementById('savedList');

  if(made.length === 0){
    el.innerHTML = 'Nothing saved yet.';
    return;
  }

  el.innerHTML = '';

  made.forEach(item => {

    const div = document.createElement('div');

    div.className = 'saved';

    div.textContent = item.dessert + ' — ' + item.country;

    el.appendChild(div);
  });
}
</script>

</body>
</html>
