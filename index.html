<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dessert Explorer</title>
<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;padding:20px}
.container{max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:18px;border:none;border-radius:18px;font-weight:bold;font-size:16px;cursor:pointer}
.primary{background:#fff;color:#000}
.secondary{background:#172554;color:#fff}
.card{margin-top:20px;background:#0f172a;border-radius:28px;overflow:hidden}
.hero{width:100%;height:360px;object-fit:cover;background:#111827}
.content{padding:24px}
.recipe{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(90deg,#f97316,#ec4899)}
.search{width:100%;padding:18px;border:none;border-radius:18px;margin-top:20px;box-sizing:border-box}
.item{background:#111827;padding:14px;border-radius:14px;margin-top:10px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.box{background:#111827;padding:20px;border-radius:20px;width:90%;max-width:500px;max-height:80vh;overflow:auto}
.saved{background:#172554;padding:12px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🍰 Dessert Explorer</h1>
<p>191-country edition</p>

<div class="grid">
<button class="primary" onclick="randomDessert()">🎲 Random Dessert</button>
<button class="secondary" onclick="markMade()">✅ Made</button>
<button class="secondary" onclick="openMade()">📘 What We've Made</button>
<button class="secondary" onclick="clearMade()">🗑 Clear List</button>
</div>

<div class="card">
<img id="hero" class="hero">
<div class="content">
<h2 id="dessert"></h2>
<h3 id="country"></h3>
<a id="recipe" class="recipe" target="_blank">View Recipe</a>
</div>
</div>

<input id="search" class="search" placeholder="Search desserts or countries">
<div id="list"></div>
</div>

<div id="modal" class="modal">
<div class="box">
<h2>What We've Made</h2>
<div id="madeList"></div>
<button class="secondary" onclick="closeMade()" style="width:100%;margin-top:16px">Close</button>
</div>
</div>

<script>
let desserts=[];
let current=null;
let made=JSON.parse(localStorage.getItem('madeDesserts')||'[]');

fetch('./desserts.json')
.then(r=>r.json())
.then(data=>{
desserts=data;
current=desserts[0];
render();
renderList(desserts);
});

function render(){
const img=document.getElementById('hero');
img.onerror=()=>{img.src='https://picsum.photos/1200/800';};
img.src=current.image;
document.getElementById('dessert').textContent=current.dessert;
document.getElementById('country').textContent=current.country;
document.getElementById('recipe').href=current.recipe;
}

function randomDessert(){
current=desserts[Math.floor(Math.random()*desserts.length)];
render();
}

function markMade(){
if(!made.find(x=>x.country===current.country)){
made.push(current);
localStorage.setItem('madeDesserts',JSON.stringify(made));
alert('Saved');
}
}

function openMade(){
renderMade();
document.getElementById('modal').style.display='flex';
}

function closeMade(){
document.getElementById('modal').style.display='none';
}

function clearMade(){
made=[];
localStorage.removeItem('madeDesserts');
renderMade();
}

function renderMade(){
document.getElementById('madeList').innerHTML=
made.map(x=>`<div class="saved">${x.dessert} — ${x.country}</div>`).join('') || 'Nothing saved yet.';
}

function renderList(items){
document.getElementById('list').innerHTML=
items.map(i=>`<div class="item" onclick='pick(${JSON.stringify(JSON.stringify(i))})'><b>${i.dessert}</b><br>${i.country}</div>`).join('');
}

function pick(v){
current=JSON.parse(v);
render();
window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
renderList(desserts.filter(d=>d.country.toLowerCase().includes(q)||d.dessert.toLowerCase().includes(q)));
});
</script>
</body>
</html>
