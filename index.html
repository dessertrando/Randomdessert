
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dessert Explorer</title>

<style>
body{
background:#020617;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:24px;
}
.container{
max-width:900px;
margin:auto;
}
.top{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}
button{
border:none;
padding:16px 20px;
border-radius:18px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}
.primary{background:white;color:black;}
.secondary{background:#172554;color:white;}
.card{
background:#0f172a;
border-radius:28px;
overflow:hidden;
}
.hero{
width:100%;
height:360px;
object-fit:cover;
background:#111827;
}
.content{
padding:28px;
}
.recipe{
display:inline-block;
margin-top:18px;
padding:16px 24px;
border-radius:18px;
background:linear-gradient(90deg,#f97316,#ec4899);
color:white;
font-weight:bold;
text-decoration:none;
}
.search{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:20px;
font-size:18px;
}
.list-item{
background:#111827;
padding:18px;
border-radius:18px;
margin-top:14px;
cursor:pointer;
}
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
}
.modal-box{
background:#111827;
padding:24px;
border-radius:24px;
width:90%;
max-width:420px;
}
.modal input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin-top:12px;
}
.made-item{
background:#172554;
padding:14px;
border-radius:14px;
margin-top:10px;
}
.small{
opacity:.7;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🍰 Dessert Explorer</h1>
<p>Saved accounts + made desserts + working dessert photos</p>

<div class="top">
<button class="primary" onclick="randomDessert()">🎲 Random Dessert</button>
<button class="secondary" onclick="markMade()">✅ Made</button>
<button class="secondary" onclick="openMade()">📘 What I've Made</button>
<button class="secondary" onclick="openAccount()">👤 Account</button>
</div>

<div id="userStatus" class="small">Not logged in</div>

<div class="card">
<img id="hero" class="hero">

<div class="content">
<div id="flag" style="font-size:52px;">🌍</div>

<h2 id="dessert"></h2>
<h3 id="country"></h3>

<a id="recipe" class="recipe" target="_blank">View Recipe</a>
</div>
</div>

<input id="search" class="search" placeholder="Search desserts or countries">

<div id="results"></div>

</div>

<div id="accountModal" class="modal">
<div class="modal-box">
<h2>Account</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="register()">Create Account</button>
<button class="secondary" onclick="login()">Login</button>
<button class="secondary" onclick="logout()">Logout</button>
<button class="secondary" onclick="closeAccount()">Close</button>

<div class="small">
Requires Firebase Authentication + Firestore setup.
</div>
</div>
</div>

<div id="madeModal" class="modal">
<div class="modal-box">
<h2>Made Desserts</h2>
<div id="madeList"></div>
<button class="secondary" onclick="closeMade()">Close</button>
</div>
</div>

<script type="module">

import {
 auth,
 db,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 doc,
 setDoc,
 getDoc
} from './firebase.js';

let desserts = [];
let current = null;
let currentUser = null;
let madeDesserts = [];

const flags = {
 "France":"🇫🇷",
 "Italy":"🇮🇹",
 "Japan":"🇯🇵",
 "Mexico":"🇲🇽",
 "Turkey":"🇹🇷",
 "India":"🇮🇳",
 "Austria":"🇦🇹",
 "Argentina":"🇦🇷",
 "Portugal":"🇵🇹",
 "Germany":"🇩🇪"
};

async function init(){
 const res = await fetch('./desserts.json');
 desserts = await res.json();

 current = desserts[0];

 renderCurrent();
 renderList(desserts);

 document.getElementById('search').addEventListener('input', e=>{
   const q = e.target.value.toLowerCase();

   renderList(
     desserts.filter(d =>
       d.country.toLowerCase().includes(q) ||
       d.dessert.toLowerCase().includes(q)
     )
   );
 });
}

async function getDessertImage(name){

 try{
   const res = await fetch(
     `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`
   );

   const data = await res.json();

   if(data.thumbnail && data.thumbnail.source){
     return data.thumbnail.source;
   }

 }catch(e){}

 return `https://picsum.photos/seed/${encodeURIComponent(name)}/1200/800`;
}

async function renderCurrent(){

 document.getElementById('dessert').innerText = current.dessert;
 document.getElementById('country').innerText = current.country;
 document.getElementById('flag').innerText = flags[current.country] || "🌍";
 document.getElementById('recipe').href = current.recipe;

 const img = await getDessertImage(current.dessert);
 document.getElementById('hero').src = img;
}

function renderList(items){

 document.getElementById('results').innerHTML = items.map(item => `
   <div class="list-item"
     onclick='window.pickDessert(${JSON.stringify(JSON.stringify(item))})'>

     <strong>${item.dessert}</strong><br>
     ${item.country}
   </div>
 `).join('');
}

window.pickDessert = async function(item){
 current = JSON.parse(item);
 await renderCurrent();
 window.scrollTo({top:0,behavior:'smooth'});
}

window.randomDessert = async function(){
 current = desserts[Math.floor(Math.random()*desserts.length)];
 await renderCurrent();
}

window.openAccount = function(){
 document.getElementById('accountModal').style.display = 'flex';
}

window.closeAccount = function(){
 document.getElementById('accountModal').style.display = 'none';
}

window.openMade = function(){
 renderMadeList();
 document.getElementById('madeModal').style.display = 'flex';
}

window.closeMade = function(){
 document.getElementById('madeModal').style.display = 'none';
}

window.register = async function(){

 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;

 try{
   await createUserWithEmailAndPassword(auth,email,password);
   alert('Account created');
 }catch(err){
   alert(err.message);
 }
}

window.login = async function(){

 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;

 try{
   await signInWithEmailAndPassword(auth,email,password);
   alert('Logged in');
 }catch(err){
   alert(err.message);
 }
}

window.logout = async function(){
 await signOut(auth);
}

async function saveMade(){

 if(!currentUser) return;

 await setDoc(
   doc(db,"users",currentUser.uid),
   { madeDesserts },
   { merge:true }
 );
}

async function loadMade(){

 if(!currentUser) return;

 const snap = await getDoc(doc(db,"users",currentUser.uid));

 if(snap.exists()){
   madeDesserts = snap.data().madeDesserts || [];
 }

 renderMadeList();
}

window.markMade = async function(){

 if(!currentUser){
   alert('Please log in first');
   return;
 }

 if(!madeDesserts.find(d => d.dessert === current.dessert)){

   madeDesserts.push(current);

   await saveMade();

   alert('Saved to your made list');
 }
}

function renderMadeList(){

 document.getElementById('madeList').innerHTML =
   madeDesserts.map(d => `
     <div class="made-item">
       ${d.dessert} — ${d.country}
     </div>
   `).join('') || 'No desserts saved yet.';
}

onAuthStateChanged(auth, async user => {

 currentUser = user;

 if(user){

   document.getElementById('userStatus').innerText =
     'Logged in as ' + user.email;

   await loadMade();

 }else{

   document.getElementById('userStatus').innerText =
     'Not logged in';

   madeDesserts = [];
 }
});

init();

</script>

</body>
</html>
