<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dessert Explorer</title>
<style>
body{
background:#020617;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:24px;
}
.container{
max-width:900px;
margin:auto;
}
.card{
background:#0f172a;
border-radius:24px;
padding:24px;
}
img{
width:100%;
height:320px;
object-fit:cover;
border-radius:18px;
}
button{
padding:14px 18px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
margin-top:18px;
}
.search{
width:100%;
padding:16px;
margin:20px 0;
border-radius:14px;
border:none;
}
</style>
</head>
<body>

<div class="container">
<h1>🍰 Dessert Explorer</h1>
<p>190-country cleaned dessert dataset</p>

<div class="card">
<img id="dessert-image" src="https://picsum.photos/1200/800">
<h2 id="dessert-name"></h2>
<h3 id="country-name"></h3>

<a id="recipe-link" target="_blank">
<button>View Recipe</button>
</a>
</div>

<input class="search" id="search" placeholder="Search countries or desserts">

<div id="results"></div>
</div>

<script type="module">
let desserts = [];
let current = null;
import { auth, db } from './firebase.js';
 

async function init(){
 const res = await fetch('desserts.json');
 desserts = await res.json();

 current = desserts[0];
 renderCurrent();
 renderList(desserts);

 document.getElementById('search').addEventListener('input', e=>{
   const q = e.target.value.toLowerCase();

   renderList(
      desserts.filter(d =>
         d.country.toLowerCase().includes(q) ||
         d.dessert.toLowerCase().includes(q)
      )
   );
 });
}

function renderCurrent(){
 document.getElementById('dessert-name').textContent = current.dessert;
 document.getElementById('country-name').textContent = current.country;
 document.getElementById('recipe-link').href = current.recipe;
}

function renderList(items){
 document.getElementById('results').innerHTML = items.slice(0,50).map(item => `
   <button onclick='pick(${JSON.stringify(JSON.stringify(item))})'>
      ${item.country} — ${item.dessert}
   </button>
 `).join('<br>');
}

function pick(item){
 current = JSON.parse(item);
 renderCurrent();
 window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>

</body>
</html>
