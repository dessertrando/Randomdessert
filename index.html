<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dessert Explorer</title>
<style>
body{background:#020617;color:white;font-family:Arial;margin:0;padding:20px}
.container{max-width:900px;margin:auto}
button{padding:16px 22px;border:none;border-radius:18px;margin:6px;font-weight:bold;cursor:pointer}
.primary{background:white;color:black}
.secondary{background:#172554;color:white}
.card{background:#0f172a;border-radius:28px;overflow:hidden;margin-top:20px}
.hero{width:100%;height:360px;object-fit:cover;background:#111827}
.content{padding:24px}
.recipe{display:inline-block;padding:16px 22px;border-radius:18px;background:linear-gradient(90deg,#f97316,#ec4899);color:white;text-decoration:none}
.search{width:100%;padding:18px;border-radius:18px;border:none;margin-top:20px}
.item{background:#111827;padding:16px;border-radius:16px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>🍰 Dessert Explorer</h1>
<p>191-country Firebase edition</p>

<button class="primary" onclick="randomDessert()">🎲 Random Dessert</button>
<button class="secondary" onclick="markMade()">✅ Made</button>
<button class="secondary" onclick="showMade()">📘 What I've Made</button>

<div class="card">
<img id="hero" class="hero">
<div class="content">
<h2 id="dessert"></h2>
<h3 id="country"></h3>
<a id="recipe" class="recipe" target="_blank">View Recipe</a>
</div>
</div>

<input class="search" id="search" placeholder="Search desserts or countries">
<div id="list"></div>
</div>

<script>
let desserts=[], current=null;
let made = JSON.parse(localStorage.getItem('madeDesserts')||'[]');

fetch('./desserts.json').then(r=>r.json()).then(d=>{
desserts=d;
current=d[0];
render();
renderList(d);
});

function render(){
document.getElementById('hero').src=current.image;
document.getElementById('dessert').innerText=current.dessert;
document.getElementById('country').innerText=current.country;
document.getElementById('recipe').href=current.recipe;
}

function randomDessert(){
current=desserts[Math.floor(Math.random()*desserts.length)];
render();
}

function markMade(){
if(!made.find(x=>x.country===current.country)){
made.push(current);
localStorage.setItem('madeDesserts',JSON.stringify(made));
alert('Saved to made list');
}
}

function showMade(){
alert(made.map(x=>x.dessert+' — '+x.country).join('\n') || 'Nothing saved yet');
}

function renderList(items){
document.getElementById('list').innerHTML=items.slice(0,30).map(i=>`
<div class="item" onclick='pick(${JSON.stringify(JSON.stringify(i))})'>
<b>${i.dessert}</b><br>${i.country}
</div>`).join('');
}

function pick(v){
current=JSON.parse(v);
render();
window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('input',e=>{
if(e.target.id==='search'){
const q=e.target.value.toLowerCase();
renderList(desserts.filter(d=>d.country.toLowerCase().includes(q)||d.dessert.toLowerCase().includes(q)));
}
});
</script>
</body>
</html>
