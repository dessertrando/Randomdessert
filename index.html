
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dessert Explorer</title>

<style>
body{
  margin:0;
  background:#020617;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:24px;
}

.topbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:24px;
}

button{
  border:none;
  border-radius:18px;
  padding:16px 22px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.random-btn{
  background:white;
  color:black;
}

.account-btn{
  background:#172554;
  color:white;
}

.card{
  background:#0f172a;
  border-radius:28px;
  overflow:hidden;
  margin-top:24px;
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
}

.content{
  padding:28px;
}

.recipe{
  margin-top:24px;
  display:inline-block;
  background:linear-gradient(90deg,#f97316,#ec4899);
  color:white;
  text-decoration:none;
  padding:18px 26px;
  border-radius:18px;
  font-weight:bold;
}

.search{
  width:100%;
  margin-top:24px;
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:18px;
}

.list{
  margin-top:24px;
}

.item{
  background:#111827;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#111827;
  padding:24px;
  border-radius:24px;
  width:90%;
  max-width:420px;
}

.modal input{
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:14px;
  border:none;
}

.modal button{
  margin-top:12px;
  width:100%;
}

.user{
  margin-top:14px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<h1>🍰 Dessert Explorer</h1>
<p>Explore desserts from around the world</p>

<div class="topbar">
  <button class="random-btn" onclick="randomDessert()">🎲 Random Dessert</button>
  <button class="account-btn" onclick="openAccount()">👤 Account</button>
</div>

<div class="user" id="user-display">
Not logged in
</div>

<div class="card">
  <img id="dessert-image" src="">

  <div class="content">
    <h2 id="dessert-name"></h2>
    <h3 id="country-name"></h3>

    <a id="recipe-link" class="recipe" target="_blank">
      View Recipe
    </a>
  </div>
</div>

<input class="search" id="search" placeholder="Search countries or desserts">

<div class="list" id="list"></div>

</div>

<div class="modal" id="account-modal">
  <div class="modal-content">
    <h2>Account</h2>

    <input id="username" placeholder="Enter username">

    <button onclick="login()">Login / Create Account</button>
    <button onclick="closeAccount()">Close</button>
  </div>
</div>

<script>

let desserts = [];
let current = null;

async function init(){
  const res = await fetch('desserts.json');
  desserts = await res.json();

  current = desserts[0];

  renderCurrent();
  renderList(desserts);

  document.getElementById('search').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();

    const filtered = desserts.filter(d =>
      d.country.toLowerCase().includes(q) ||
      d.dessert.toLowerCase().includes(q)
    );

    renderList(filtered);
  });
}

function renderCurrent(){

  document.getElementById('dessert-name').innerText = current.dessert;
  document.getElementById('country-name').innerText = current.country;

  document.getElementById('dessert-image').src =
    `https://source.unsplash.com/featured/1200x800/?${encodeURIComponent(current.dessert)}`;

  document.getElementById('recipe-link').href = current.recipe;
}

function renderList(items){
  document.getElementById('list').innerHTML = items.map(item => `
    <div class="item" onclick='pick(${JSON.stringify(JSON.stringify(item))})'>
      <strong>${item.dessert}</strong><br>
      ${item.country}
    </div>
  `).join('');
}

function pick(item){
  current = JSON.parse(item);
  renderCurrent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function randomDessert(){
  current = desserts[Math.floor(Math.random()*desserts.length)];
  renderCurrent();
}

function openAccount(){
  document.getElementById('account-modal').style.display = 'flex';
}

function closeAccount(){
  document.getElementById('account-modal').style.display = 'none';
}

function login(){
  const username = document.getElementById('username').value.trim();

  if(!username) return;

  localStorage.setItem('dessertUser', username);

  document.getElementById('user-display').innerText =
    'Logged in as ' + username;

  closeAccount();
}

const savedUser = localStorage.getItem('dessertUser');

if(savedUser){
  document.getElementById('user-display').innerText =
    'Logged in as ' + savedUser;
}

init();

</script>

</body>
</html>
